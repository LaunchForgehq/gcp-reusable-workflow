name: Run Cloud Run Job

# Reusable Cloud Run JOB workflow.
#
# Cloud Run services and Cloud Run jobs have different lifecycles. A service is
# long-running and receives traffic; a job is a finite, one-shot execution whose
# exit status is the release gate for schema migrations. Keeping the two in one
# multipurpose pipeline would make the service pipeline harder to reason about
# and would let a migration run be retried as if it were a deployment.
#
# This workflow therefore owns ONLY the job lifecycle:
#
#   validate -> (optional build/push) -> update job image -> execute
#            -> wait -> assert non-zero-free result -> surface logs + run identity
#
# The caller supplies configuration. No GCP mechanic (authentication, image
# build, Artifact Registry push, job deployment, execution) is duplicated in a
# caller repository.
#
# AUTHORITY SPLIT (ADR 0037). This workflow owns the job REVISION and its
# EXECUTION. Terraform owns the job ENVELOPE.
#
#   Terraform: service account, env vars, secret bindings, container command
#              and args, CPU/memory, retry policy, task count, parallelism
#   This workflow: which immutable image the job runs, and when it runs
#
# That is why there are no `env_vars`, `secret_refs`, `command`, `args`,
# `job_flags`, or service-account inputs below. They used to exist, and they
# were a second infrastructure authority: a migration caller could rewrite the
# reviewed envelope, and the rewritten configuration would silently serve until
# the next `terraform apply` reverted it. The job is created by Terraform; this
# workflow refuses to create one, because a job that appears for the first time
# during a release has an envelope nobody reviewed.
#
# The image is applied with `gcloud run jobs update`, which is a read-modify-write
# of the existing spec: every field this workflow does not name is preserved.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub deployment environment (dev, stage, or production).
        required: true
        type: string
      job:
        description: Cloud Run Job name.
        required: true
        type: string
      image_name:
        description: Image name used to derive the git-SHA image reference. Defaults to the job name.
        required: false
        default: ''
        type: string
      image:
        description: Full image reference to run. When set, no image is built or pushed. Must carry an immutable git-SHA tag.
        required: false
        default: ''
        type: string
      docker_context:
        description: Docker build context, relative to the repository root.
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile path, relative to the repository root.
        required: false
        default: ./Dockerfile
        type: string
      build_args:
        description: >-
          Optional Docker build arguments as newline-separated NAME=VALUE
          entries, passed to `docker build --build-arg`. Intended for
          non-secret values that must exist at BUILD time because the image
          bakes them in (for example a release version). This configures the
          ARTIFACT, which the release owns - never the Cloud Run envelope,
          which Terraform owns. Never use it for credentials: build arguments
          are visible in image metadata.
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: Workflow job timeout in minutes.
        required: false
        default: 20
        type: number
      setup_command:
        description: Optional application setup or dependency installation command (build path only).
        required: false
        default: ''
        type: string
      lint_command:
        description: Optional lint or static-validation command (build path only).
        required: false
        default: ''
        type: string
      test_command:
        description: Optional application test command (build path only).
        required: false
        default: ''
        type: string
      pre_build_command:
        description: Optional final validation or application build command (build path only).
        required: false
        default: ''
        type: string
    secrets:
      NPMRC:
        description: Optional user-level .npmrc content for private package registries, mounted as a BuildKit secret.
        required: false
    outputs:
      image:
        description: Image reference the job was executed with.
        value: ${{ jobs.run.outputs.image }}
      execution_name:
        description: Cloud Run job execution name.
        value: ${{ jobs.run.outputs.execution_name }}

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  run:
    name: Run migration job
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: cloud-run-job-${{ github.repository }}-${{ inputs.environment }}-${{ inputs.job }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.configuration.outputs.image }}
      execution_name: ${{ steps.execute.outputs.execution_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate job configuration
        id: configuration
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          JOB: ${{ inputs.job }}
          IMAGE_NAME_INPUT: ${{ inputs.image_name }}
          IMAGE_INPUT: ${{ inputs.image }}
          ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          BUILD_CONTEXT: ${{ inputs.docker_context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          required_names=(
            DEPLOYMENT_ENVIRONMENT
            PROJECT_ID
            REGION
            JOB
            WORKLOAD_IDENTITY_PROVIDER
            DEPLOY_SERVICE_ACCOUNT
          )

          for name in "${required_names[@]}"; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error title=Invalid job configuration::${name} must not be empty."
              exit 1
            fi
          done

          if [[ ! "$DEPLOYMENT_ENVIRONMENT" =~ ^(dev|stage|production)$ ]]; then
            echo "::error title=Invalid environment::environment must be one of: dev, stage, production."
            exit 1
          fi

          if [[ ! "$REGION" =~ ^[a-z][a-z0-9-]*[a-z0-9]$ ]]; then
            echo "::error title=Invalid region::region must be a valid Google Cloud region name."
            exit 1
          fi

          if [[ ! "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error title=Invalid project ID::project_id must be a standard 6-30 character Google Cloud project ID. Legacy domain-scoped project IDs are not supported."
            exit 1
          fi

          if [[ ! "$JOB" =~ ^[a-z]([a-z0-9-]{0,47}[a-z0-9])?$ ]]; then
            echo "::error title=Invalid job::job must be a valid Cloud Run job name (lowercase letters, numbers, and hyphens)."
            exit 1
          fi

          if [[ -n "$IMAGE_INPUT" ]]; then
            image="$IMAGE_INPUT"
            build_required=false

            # An explicit image must be immutable. A branch or `latest` tag
            # makes a migration unreproducible and lets the executed bytes
            # differ from the reviewed release.
            if [[ ! "$image" =~ :[0-9a-f]{40}$ ]]; then
              echo "::error title=Mutable job image::image must end in a 40-character git-SHA tag, got '$image'."
              exit 1
            fi
          else
            image_name="${IMAGE_NAME_INPUT:-$JOB}"
            if [[ ! "$ARTIFACT_REGISTRY" =~ ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
              echo "::error title=Invalid Artifact Registry::GCP_ARTIFACT_REGISTRY must be a valid Artifact Registry repository name."
              exit 1
            fi
            if [[ -z "${BUILD_CONTEXT//[[:space:]]/}" || -z "${DOCKERFILE//[[:space:]]/}" ]]; then
              echo "::error title=Invalid image build::docker_context and dockerfile must not be empty when no explicit image is supplied."
              exit 1
            fi
            image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY}/${image_name}:${GITHUB_SHA}"
            build_required=true
          fi

          {
            printf 'project_id=%s\n' "$PROJECT_ID"
            printf 'region=%s\n' "$REGION"
            printf 'workload_identity_provider=%s\n' "$WORKLOAD_IDENTITY_PROVIDER"
            printf 'deploy_service_account=%s\n' "$DEPLOY_SERVICE_ACCOUNT"
            printf 'image=%s\n' "$image"
            printf 'build_required=%s\n' "$build_required"
          } >> "$GITHUB_OUTPUT"

          printf 'JOB_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

          printf 'Migrating with image %s\n' "$image"

      - name: Prepare private registry configuration
        shell: bash
        env:
          APP_NPMRC: ${{ secrets.NPMRC }}
          PACKAGE_TOKEN: ${{ github.token }}
          BUILD_CONTEXT: ${{ inputs.docker_context }}
        run: |
          set -euo pipefail

          npmrc="$RUNNER_TEMP/npmrc"

          if [[ -n "${APP_NPMRC//[[:space:]]/}" ]]; then
            umask 077
            printf '%s\n' "$APP_NPMRC" > "$npmrc"
            echo "::add-mask::$APP_NPMRC"
          elif [[ -f "$BUILD_CONTEXT/.npmrc" ]]; then
            # No explicit registry credential was supplied, so the build
            # authenticates with the repository-scoped GITHUB_TOKEN instead of
            # a long-lived package token. The registry and scope mapping come
            # from the repository's own .npmrc; only the token is added, and
            # only to the BuildKit secret, so no credential reaches an image
            # layer, the build log, or the pushed artifact.
            umask 077
            {
              printf '//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGE_TOKEN"
              cat "$BUILD_CONTEXT/.npmrc"
            } > "$npmrc"
            echo "::add-mask::$PACKAGE_TOKEN"
          else
            echo "No private package registry configuration supplied."
            exit 0
          fi

          printf 'DOCKER_BUILD_SECRET_FLAG=--secret=id=npmrc,src=%s\n' "$npmrc" >> "$GITHUB_ENV"

      - name: Application setup
        if: ${{ inputs.image == '' && inputs.setup_command != '' }}
        shell: bash
        env:
          APP_COMMAND: ${{ inputs.setup_command }}
        run: bash --noprofile --norc -eo pipefail -c "$APP_COMMAND"

      - name: Lint and static validation
        if: ${{ inputs.image == '' && inputs.lint_command != '' }}
        shell: bash
        env:
          APP_COMMAND: ${{ inputs.lint_command }}
        run: bash --noprofile --norc -eo pipefail -c "$APP_COMMAND"

      - name: Run application tests
        if: ${{ inputs.image == '' && inputs.test_command != '' }}
        shell: bash
        env:
          APP_COMMAND: ${{ inputs.test_command }}
        run: bash --noprofile --norc -eo pipefail -c "$APP_COMMAND"

      - name: Pre-build validation
        if: ${{ inputs.image == '' && inputs.pre_build_command != '' }}
        shell: bash
        env:
          APP_COMMAND: ${{ inputs.pre_build_command }}
        run: bash --noprofile --norc -eo pipefail -c "$APP_COMMAND"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ steps.configuration.outputs.project_id }}
          workload_identity_provider: ${{ steps.configuration.outputs.workload_identity_provider }}
          service_account: ${{ steps.configuration.outputs.deploy_service_account }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ steps.configuration.outputs.project_id }}

      - name: Configure Docker for Artifact Registry
        if: ${{ steps.configuration.outputs.build_required == 'true' }}
        shell: bash
        env:
          REGISTRY_HOST: ${{ steps.configuration.outputs.region }}-docker.pkg.dev
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build immutable container image
        if: ${{ steps.configuration.outputs.build_required == 'true' }}
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'
          BUILD_SECRET_FLAG: ${{ env.DOCKER_BUILD_SECRET_FLAG }}
          BUILD_CONTEXT: ${{ inputs.docker_context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail

          build_arg_flags=()

          if [[ -n "${BUILD_ARGS//[[:space:]]/}" ]]; then
            while IFS= read -r entry; do
              [[ -z "${entry//[[:space:]]/}" ]] && continue

              if [[ ! "$entry" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
                echo "::error title=Invalid build argument::build_args entries must be NAME=VALUE. Got: $entry"
                exit 1
              fi

              build_arg_flags+=(--build-arg "$entry")
            done <<< "$BUILD_ARGS"
          fi

          docker build \
            --file "$DOCKERFILE" \
            --tag "$JOB_IMAGE" \
            ${build_arg_flags[@]+"${build_arg_flags[@]}"} \
            $BUILD_SECRET_FLAG \
            "$BUILD_CONTEXT"

      - name: Push immutable container image
        if: ${{ steps.configuration.outputs.build_required == 'true' }}
        shell: bash
        run: docker push "$JOB_IMAGE"

      # Terraform creates the job and owns its envelope. This workflow refuses
      # to create one: a job that first appears during a release would carry an
      # envelope no review ever saw.
      - name: Verify the job envelope exists
        id: envelope
        shell: bash
        env:
          PROJECT_ID: ${{ steps.configuration.outputs.project_id }}
          REGION: ${{ steps.configuration.outputs.region }}
          JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail

          if ! gcloud run jobs describe "$JOB" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(metadata.name)' > /dev/null 2>&1; then
            echo "::error title=Unknown Cloud Run job::Job '$JOB' does not exist in $PROJECT_ID/$REGION. Terraform owns job creation; apply the production infrastructure root before running migrations."
            exit 1
          fi

          echo "Job $JOB exists; its envelope is Terraform-owned."

      # Image-only update. `gcloud run jobs update` is a read-modify-write of
      # the existing job spec, so every field this command does not name -- the
      # service account, environment variables, secret bindings, command, args,
      # CPU/memory, retry policy, task count -- is preserved exactly as
      # Terraform declared it. A migration can therefore change the bytes and
      # nothing else.
      - name: Update job image
        id: deploy
        shell: bash
        env:
          PROJECT_ID: ${{ steps.configuration.outputs.project_id }}
          REGION: ${{ steps.configuration.outputs.region }}
          JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail

          gcloud run jobs update "$JOB" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$JOB_IMAGE" \
            --quiet

          printf 'Job %s image set to %s\n' "$JOB" "$JOB_IMAGE"

      - name: Execute Cloud Run job
        id: execute
        shell: bash
        env:
          PROJECT_ID: ${{ steps.configuration.outputs.project_id }}
          REGION: ${{ steps.configuration.outputs.region }}
          JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail

          execution="$(gcloud run jobs execute "$JOB" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --wait \
            --format='value(metadata.name)')"

          if [[ -z "${execution//[[:space:]]/}" ]]; then
            echo "::error title=Missing execution identity::gcloud returned no execution name for job $JOB."
            exit 1
          fi

          printf 'execution_name=%s\n' "$execution" >> "$GITHUB_OUTPUT"
          printf 'Migration execution: %s\n' "$execution"

      - name: Assert execution result
        shell: bash
        env:
          PROJECT_ID: ${{ steps.configuration.outputs.project_id }}
          REGION: ${{ steps.configuration.outputs.region }}
          JOB: ${{ inputs.job }}
          EXECUTION: ${{ steps.execute.outputs.execution_name }}
        run: |
          set -euo pipefail

          describe_args=(
            run jobs executions describe "$EXECUTION"
            --project="$PROJECT_ID"
            --region="$REGION"
          )

          condition="$(gcloud "${describe_args[@]}" \
            --format='value(status.conditions[0].type,status.conditions[0].state,status.conditions[0].message)')"
          printf 'Execution condition: %s\n' "$condition"

          counts="$(gcloud "${describe_args[@]}" --format='value(status.succeededCount,status.failedCount)')"
          succeeded="$(printf '%s' "$counts" | awk '{print $1}')"
          failed="$(printf '%s' "$counts" | awk '{print $2}')"

          if [[ "${failed:-0}" != "0" || "${succeeded:-0}" == "0" ]]; then
            echo "::error title=Migration execution failed::Job $JOB execution $EXECUTION reported succeeded=$succeeded failed=$failed."
            exit 1
          fi

          echo "Job $JOB execution $EXECUTION completed: succeeded=$succeeded failed=$failed"

      - name: Surface execution logs
        if: ${{ always() }}
        shell: bash
        env:
          PROJECT_ID: ${{ steps.configuration.outputs.project_id }}
          REGION: ${{ steps.configuration.outputs.region }}
          JOB: ${{ inputs.job }}
          EXECUTION: ${{ steps.execute.outputs.execution_name }}
        run: |
          set -euo pipefail

          if [[ -z "${EXECUTION//[[:space:]]/}" ]]; then
            echo "No execution identity was produced, so no logs can be located."
            exit 0
          fi

          filter="resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\" AND labels.\"run.googleapis.com/execution_name\"=\"${EXECUTION}\""

          set +e
          gcloud logging read "$filter" \
            --project="$PROJECT_ID" \
            --limit=300 \
            --format='value(timestamp,textPayload)' \
            --freshness=1h
          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            echo "::warning title=Log retrieval unavailable::Cloud Logging did not return entries for execution $EXECUTION. Inspect the execution in the Google Cloud console."
          fi

      - name: Write migration summary
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          PROJECT_ID: ${{ steps.configuration.outputs.project_id }}
          REGION: ${{ steps.configuration.outputs.region }}
          JOB: ${{ inputs.job }}
          IMAGE: ${{ steps.configuration.outputs.image }}
          EXECUTION: ${{ steps.execute.outputs.execution_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          {
            echo "## Cloud Run Job Execution"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`$DEPLOYMENT_ENVIRONMENT\` |"
            echo "| GCP project | \`$PROJECT_ID\` |"
            echo "| Region | \`$REGION\` |"
            echo "| Cloud Run job | \`$JOB\` |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Git SHA | \`$GIT_SHA\` |"
            echo "| Execution | \`${EXECUTION:-not created}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
